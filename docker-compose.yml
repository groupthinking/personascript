version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: personascript_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://personascript:personascript_password@postgres:5432/personascript_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=personascript-super-secret-jwt-key
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: personascript_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=personascript_db
      - POSTGRES_USER=personascript
      - POSTGRES_PASSWORD=personascript_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personascript -d personascript_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: personascript_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
